kind = "video"
previewPath = "/proofstore-video/"
title = "ProofStore Presentation"
version = "1.0.0"
id = "artifacts/proofstore-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/proofstore-video/" ]
localPort = 23775

[services.development]
run = "pnpm --filter @workspace/proofstore-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/proofstore-video", "run", "build" ]
publicDir = "artifacts/proofstore-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23775"
BASE_PATH = "/proofstore-video/"
